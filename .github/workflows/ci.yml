name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:cli
      - name: Determinism smoke test
        run: |
          node cli-dist/cli.js generate --seed 42 --out /tmp/t42.json
          node cli-dist/cli.js validate /tmp/t42.json --verify regenerate && rc=0 || rc=$?
          test "$rc" -le 1
