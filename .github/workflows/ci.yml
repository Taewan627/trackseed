name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [20, 22, 24]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run build:cli
      - name: Determinism smoke test
        shell: bash
        run: |
          node cli-dist/cli.js generate --seed 42 --out "$RUNNER_TEMP/t42.json"
          node cli-dist/cli.js validate "$RUNNER_TEMP/t42.json" --verify regenerate && rc=0 || rc=$?
          test "$rc" -le 1

  determinism:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.9.6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - run: npm ci
      - run: npm run build:cli
      - name: Node CLI digests, legacy v1.0.0 join (node cli-dist/cli.js generate --set autoJoin=legacy)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cli"
          for seed in 0 1 42 7; do
            for pattern in auto hairpin; do
              node cli-dist/cli.js generate --seed "$seed" --set cornerPattern="$pattern" --set autoJoin=legacy --out "$RUNNER_TEMP/cli/seed$seed-$pattern.json"
            done
          done
          node scripts/ci-digests.mjs --from-dir "$RUNNER_TEMP/cli" --check tests/fixtures/ci-golden-digests.json
      - name: Node CLI digests, default tangent join (node cli-dist/cli.js generate)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/cli-tangent"
          for seed in 0 1 42 7; do
            for pattern in auto hairpin; do
              node cli-dist/cli.js generate --seed "$seed" --set cornerPattern="$pattern" --out "$RUNNER_TEMP/cli-tangent/seed$seed-$pattern.json"
            done
          done
          node scripts/ci-digests.mjs --from-dir "$RUNNER_TEMP/cli-tangent" --check tests/fixtures/ci-golden-digests-v1.1.json
      - name: Node digests (cli-dist modules)
        run: |
          node scripts/ci-digests.mjs --check tests/fixtures/ci-golden-digests.json
          node scripts/ci-digests.mjs --auto-join tangent --check tests/fixtures/ci-golden-digests-v1.1.json
      - name: Deno digests (cli-dist modules)
        run: |
          deno run -A scripts/ci-digests.mjs --check tests/fixtures/ci-golden-digests.json
          deno run -A scripts/ci-digests.mjs --auto-join tangent --check tests/fixtures/ci-golden-digests-v1.1.json
      - name: Bun digests (cli-dist modules)
        run: |
          bun scripts/ci-digests.mjs --check tests/fixtures/ci-golden-digests.json
          bun scripts/ci-digests.mjs --auto-join tangent --check tests/fixtures/ci-golden-digests-v1.1.json
